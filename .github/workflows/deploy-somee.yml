name: Auto Build and Deploy to Somee

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish project (SingleFile Compressed)
        run: |
          dotnet publish -c Release -r win-x86 --self-contained true \
            /p:PublishSingleFile=true \
            /p:EnableCompressionInSingleFile=true \
            /p:DebugType=None \
            /p:DebugSymbols=false \
            -o ./publish

          # Xóa các file PDB thừa nếu còn sót
          find ./publish -name "*.pdb" -type f -delete

          # Xóa các thư mục đa ngôn ngữ không dùng đến (tiết kiệm ~15-20MB)
          for lang in cs de es fr it ja ko pl pt-BR ru tr zh-Hans zh-Hant; do
            rm -rf ./publish/$lang
          done

      - name: Upload published files to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          protocol: ftp
          security: loose
          local-dir: ./publish/
          server-dir: /www.quanlycuahanghoa.somee.com/