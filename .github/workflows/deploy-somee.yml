name: Auto Build and Deploy to Somee

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x" # Chỉnh lại nếu dự án dùng bản khác

      - name: Publish project
        run: dotnet publish -c Release -o ./publish

      - name: Create app_offline.htm to unlock IIS files
        run: echo "<h1>Dang cap nhat he thong, vui long quay lai sau 30 giay...</h1>" > ./app_offline.htm

      - name: Put app offline on Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          local-dir: ./
          include: |
            app_offline.htm

      - name: Upload published files to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          local-dir: ./publish/
          exclude: |
            **/.git*
            **/.git*/**

      - name: Bring app back online (remove app_offline.htm)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          local-dir: ./publish/
          include: |
            non-existent-file-to-trigger-clean
          dangerous-clean-slate: false
