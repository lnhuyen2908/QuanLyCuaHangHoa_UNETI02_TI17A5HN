name: Auto Build and Deploy to Somee

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish project (Self-Contained, IIS Compatible, <150MB)
        run: |
          dotnet publish -c Release -r win-x86 --self-contained true \
            /p:DebugType=None \
            /p:DebugSymbols=false \
            -o ./publish

          # Xóa các file PDB thừa nếu còn sót
          find ./publish -name "*.pdb" -type f -delete

          # Xóa các thư mục đa ngôn ngữ không dùng đến
          for lang in cs de es fr it ja ko pl pt-BR ru tr zh-Hans zh-Hant; do
            rm -rf ./publish/$lang
          done

          # Xóa source maps (.map), RTL CSS (.rtl.*) trong wwwroot và các file crash-dump debugger không cần thiết
          find ./publish/wwwroot -type f \( -name "*.map" -o -name "*.rtl.*" \) -delete
          rm -f ./publish/createdump.exe ./publish/mscordaccore*.dll ./publish/mscordbi.dll ./publish/Microsoft.DiaSymReader.Native.x86.dll

      - name: Upload published files to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          protocol: ftp
          security: loose
          local-dir: ./publish/
          server-dir: /www.quanlycuahanghoa.somee.com/